name: CI/CD Pipeline
on:
  push:
    branches:
      - develop
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
      - name: Update Helm chart version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          COMMIT=$(git rev-parse --short HEAD)
          NEW_TAG="${VERSION}-${COMMIT}"
          sed -i "s/tag: \".*\"/tag: \"${NEW_TAG}\"/" helm/kbot/values.yaml
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          git add helm/kbot/values.yaml
          git commit -m "Update image tag to ${NEW_TAG}"
          git push
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update ArgoCD application
        run: |
          # This step would typically use the ArgoCD CLI or API to trigger a sync
          # For now, we'll just echo a message
          echo "ArgoCD sync would be triggered here"
          # Example command (commented out):
          # argocd app sync kbot --force
      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          # Add actual deployment verification logic here
          sleep 30
      - name: Test bot functionality
        run: "echo \"Testing bot functionality...\"\n# Add actual bot testing logic here\n# This could include sending test messages and verifying responses "
