name: CI/CD Pipeline
on:
  push:
    branches:
      - develop
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: devops101-prom/kbot
permissions:
  contents: write
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - name: Get version and commit
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          COMMIT=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "COMMIT=${COMMIT}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.COMMIT }}-linux-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.COMMIT }}-linux-arm64
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            TARGETOS=linux
            TARGETARCH=amd64
      - name: Update Helm chart version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          COMMIT=$(git rev-parse --short HEAD)
          NEW_TAG="${VERSION}-${COMMIT}"
          sed -i "s/tag: \".*\"/tag: \"${NEW_TAG}\"/" helm/values.yaml
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          git add helm/values.yaml
          git commit -m "Update image tag to ${NEW_TAG}"
          git push
